name: Publish Phala Control API

on:
  push:
    branches:
      - tee_inference
      - phala_app_key
    paths:
      - ".dockerignore"
      - "control_api/**"
      - "observability/**"
      - "phala/dynamic-workers/**"
      - "phala/build_worker_inventory.py"
      - ".github/workflows/publish-control-api.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: Container tag
        required: true
        default: control

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  REGISTRY: ghcr.io
  IMAGE_NAME: uzhw8rgl/master-thesis-control-api

jobs:
  publish:
    name: Test, build and publish Control API
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test fixed worker inventory and controller
        run: |
          python -m pip install -r control_api/requirements.txt
          PYTHONPATH=. python -m unittest discover -s control_api/tests -v
          PYTHONPATH=. python -m unittest discover -s phala -p 'test_*.py' -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Control API image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: control_api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.tag || 'control' }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=control-api
          cache-to: type=gha,scope=control-api,mode=max

      - name: Publish digest-pinned reference
        run: |
          echo "Image tag:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.tag || 'control' }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Digest-pinned reference for Phala/Terraform:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy published image to Phala
    needs: publish
    if: >-
      vars.PHALA_AUTO_DEPLOY == 'true' &&
      github.ref_type == 'branch' &&
      github.ref_name == (vars.PHALA_DEPLOY_BRANCH || 'phala_app_key')
    uses: ./.github/workflows/deploy-phala.yml
    permissions:
      contents: write
      packages: read
    with:
      image-variable: control_api_image
      image-reference: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
      revision: ${{ github.sha }}
    secrets: inherit
