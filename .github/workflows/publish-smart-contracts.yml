name: Publish Smart Contracts Image

on:
  push:
    branches:
      - tee_inference
      - phala_app_key
    paths:
      - ".dockerignore"
      - "smart_contracts/**"
      - "dfl/node_server/abi/registry.json"
      - "data/initial_gm/**"
      - "data/phala_tdx_quote"
      - "data/dstack-dev-0.5.9-de9c74f0-reference-tdx-quote"
      - "phala/**"
      - ".github/workflows/publish-smart-contracts.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to publish"
        required: true
        default: "phala"

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  REGISTRY: ghcr.io
  IMAGE_NAME: uzhw8rgl/master-thesis-smart-contracts

jobs:
  publish:
    name: Build and publish smart-contracts
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js for bootstrap tests
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.1

      - name: Test smart-contract bootstrap helpers
        working-directory: smart_contracts
        run: node --test test/*.test.mjs

      - name: Build and test smart contracts
        working-directory: smart_contracts
        run: |
          forge build
          forge test -vvv

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push smart-contracts image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: smart_contracts/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag || 'phala' }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=smart-contracts-publish
          cache-to: type=gha,scope=smart-contracts-publish,mode=max

      - name: Write digest summary
        run: |
          echo "## Published smart-contracts image" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Image tag:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag || 'phala' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest-pinned reference for Phala/Terraform:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
