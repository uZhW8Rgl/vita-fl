name: Publish DFL Worker Image

on:
  push:
    branches:
      - phala
      - tee_inference
      - phala_app_key
    paths:
      - "dfl/**"
      - "tee_inference/**"
      - "agent_receipts/**"
      - "agent/blockchain_source.py"
      - "agent/ipfs_bundle.py"
      - "data/chestmnist/**"
      - "data/initial_gm/**"
      - "data/mnist/**"
      - "data/phala_tdx_quote"
      - "scripts/generate_chestmnist_training_splits.py"
      - "scripts/generate_chestmnist_signer_fixtures.py"
      - ".dockerignore"
      - ".github/workflows/publish-dfl-worker.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to publish"
        required: true
        default: "phala"

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  REGISTRY: ghcr.io
  IMAGE_NAME: uzhw8rgl/master-thesis-dfl-worker

jobs:
  publish:
    name: Build and publish DFL worker
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dfl/node_server/package-lock.json

      - name: Install worker Node.js dependencies
        working-directory: dfl/node_server
        run: npm ci

      - name: Build and test worker Node.js service
        working-directory: dfl/node_server
        run: |
          npm run build
          npm test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tee_inference/requirements.lock

      - name: Install combined worker test dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install -r tee_inference/requirements.lock

      - name: Test combined worker and TEE inference
        run: |
          PYTHONPATH=. python -m unittest discover -s tee_inference/tests -v
          PYTHONPATH=. python -m unittest discover -s dfl/tests -v
          PYTHONPATH=. python -m unittest discover -s dfl/neural_network/tests -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push DFL worker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dfl/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.image_tag || 'phala' }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=dfl-worker-rtmr
          cache-to: type=gha,scope=dfl-worker-rtmr,mode=max

      - name: Write digest summary
        run: |
          echo "## Published DFL worker image" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Image tag:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.image_tag || 'phala' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest-pinned reference for Phala/dstack:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
