name: Publish TEE Inference Image

on:
  push:
    branches:
      - tee_inference
    paths:
      - "tee_inference/**"
      - "agent_receipts/**"
      - "data/chestmnist/test_data/test-data.npz"
      - "dfl/neural_network/**"
      - "agent/blockchain_source.py"
      - "agent/ipfs_bundle.py"
      - ".github/workflows/publish-tee-inference.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to publish"
        required: true
        default: "tee"

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  REGISTRY: ghcr.io
  IMAGE_NAME: uzhw8rgl/master-thesis-tee-inference

jobs:
  test-and-publish:
    name: Test, build and publish TEE inference
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tee_inference/requirements.lock

      - name: Install protocol test dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install -r tee_inference/requirements.lock

      - name: Run TEE inference tests
        run: PYTHONPATH=. python -m unittest discover -s tee_inference/tests -v

      - name: Verify ChestMNIST Docker input
        run: |
          git restore --source=HEAD -- data/chestmnist/test_data/test-data.npz
          test -s data/chestmnist/test_data/test-data.npz
          python - <<'PY'
          import numpy as np

          path = "data/chestmnist/test_data/test-data.npz"
          with np.load(path, allow_pickle=False) as dataset:
              assert dataset["images"].shape[1:] == (28, 28)
              assert dataset["labels"].shape[1] == 14
          PY

      - name: Stage deterministic TEE build context
        run: |
          context=.github-build/tee-inference
          rm -rf "$context"
          mkdir -p "$context/agent" "$context/data/chestmnist/test_data" "$context/dfl"
          cp -R tee_inference "$context/tee_inference"
          cp -R agent_receipts "$context/agent_receipts"
          cp -R dfl/neural_network "$context/dfl/neural_network"
          cp agent/blockchain_source.py agent/ipfs_bundle.py "$context/agent/"
          cp data/chestmnist/test_data/test-data.npz "$context/data/chestmnist/test_data/"
          find "$context" -type d -name __pycache__ -prune -exec rm -rf {} +
          test -s "$context/data/chestmnist/test_data/test-data.npz"
          ls -lh "$context/data/chestmnist/test_data/test-data.npz"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push TEE inference image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .github-build/tee-inference
          file: .github-build/tee-inference/tee_inference/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag || 'tee' }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=tee-inference
          cache-to: type=gha,scope=tee-inference,mode=max

      - name: Write digest summary
        run: |
          echo "## Published TEE inference image" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Image tag:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag || 'tee' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest-pinned reference for Phala/dstack:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
