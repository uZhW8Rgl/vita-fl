name: Publish ZK Inference Image

on:
  push:
    branches:
      - tee_inference
    paths:
      - "zk_inference/**"
      - "agent/blockchain_source.py"
      - "agent/ipfs_bundle.py"
      - "tee_inference/protocol/**"
      - "tee_inference/service/__init__.py"
      - "tee_inference/service/model_source.py"
      - ".github/workflows/publish-zk-inference.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Container tag
        required: true
        default: zk

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  REGISTRY: ghcr.io
  IMAGE_NAME: uzhw8rgl/master-thesis-zk-inference

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test ZK job orchestration
        run: PYTHONPATH=. python -m unittest discover -s zk_inference/tests -v
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: zk_inference/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag || 'zk' }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=zk-inference
          cache-to: type=gha,scope=zk-inference,mode=max
      - name: Publish digest-pinned reference
        run: |
          echo "Image tag:" >> "$GITHUB_STEP_SUMMARY"
          echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag || 'zk' }}' >> "$GITHUB_STEP_SUMMARY"
          echo "Digest-pinned reference for Phala/Terraform:" >> "$GITHUB_STEP_SUMMARY"
          echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
