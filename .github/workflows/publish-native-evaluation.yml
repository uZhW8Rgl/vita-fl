name: Publish bounded native evaluation images
on:
  push:
    branches: [chapter7-live-evaluation-20261014]
    paths: ['evaluation/native-receiver/**', 'evaluation/live-agent/**', 'agent/evaluation_transport.py', '.github/workflows/publish-native-evaluation.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: native-receiver
            package: master-thesis-dfl-worker
          - component: live-agent
            package: master-thesis-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q evaluation/native-receiver evaluation/live-agent agent/evaluation_transport.py
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: evaluation/${{ matrix.component }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/uzhw8rgl/${{ matrix.package }}:chapter7-${{ matrix.component }}-${{ github.sha }}
      - run: echo 'EVALUATION_IMAGE_${{ matrix.component }}=ghcr.io/uzhw8rgl/${{ matrix.package }}@${{ steps.build.outputs.digest }}'
