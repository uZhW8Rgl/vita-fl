name: CI

on:
  push:
    branches:
      - main
      - phala_app_key
  pull_request:
    branches:
      - main
      - phala_app_key
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: uzhw8rgl/master-thesis

jobs:
  repo-hygiene:
    name: Repo Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose --env-file .env.example --env-file .env.phala.anvil.example -f compose.yml config > /tmp/compose.expanded.yml

      - name: Check for unresolved merge markers
        run: |
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' \
            --exclude-dir=.git \
            --exclude-dir=smart_contracts/lib \
            --exclude-dir=data \
            --exclude-dir=agent/downloads \
            --exclude-dir=zk_inference/out \
            .; then
            echo "Unresolved merge markers detected."
            exit 1
          fi

  python-quality:
    name: Python Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python tooling and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install -r zk_inference/requirements.txt
          python -m pip install -r agent/requirements.txt
          python -m pip install -r control_api/requirements.txt
          python -m pip install -e dfl/neural_network

      - name: Run Ruff lint
        run: ruff check agent control_api zk_inference dfl/neural_network phala/*.py transparency_log

      - name: Check formatting
        run: ruff format --check agent control_api zk_inference dfl/neural_network phala/*.py transparency_log

      - name: Python syntax smoke check
        run: |
          python -m py_compile \
            agent/run_agent.py \
            agent/blockchain_source.py \
            agent/ipfs_bundle.py \
            agent/mcp_server.py \
            agent/scitt_client.py \
            agent/tee_inference_client.py \
            control_api/phala_workers.py \
            control_api/server.py \
            data/mnist_tools.py \
            zk_inference/create_single_mnist_query.py \
            zk_inference/export_model.py \
            zk_inference/run_ezkl.py \
            zk_inference/server.py \
            zk_inference/service_tools.py \
            dfl/neural_network/dicom_provenance.py \
            dfl/neural_network/hybrid_r.py \
            dfl/neural_network/cli.py \
            dfl/neural_network/service.py \
            dfl/neural_network/start_service.py \
            scripts/generate_chestmnist_training_splits.py \
            transparency_log/bootstrap.py \
            transparency_log/test_bootstrap.py

      - name: Run agent unit tests
        run: PYTHONPATH=. python -m unittest discover -s agent/tests -v

      - name: Run ZK inference unit tests
        run: PYTHONPATH=. python -m unittest discover -s zk_inference/tests -v

      - name: Run transparency-log unit tests
        run: PYTHONPATH=. python -m unittest discover -s transparency_log -v

      - name: Run control-api unit tests
        run: PYTHONPATH=. python -m unittest discover -s control_api/tests -v

      - name: Run Phala configuration unit tests
        run: PYTHONPATH=. python -m unittest discover -s phala -p 'test_*.py' -v

      - name: Run DFL neural-network and provenance tests
        run: PYTHONPATH=. python -m unittest discover -s dfl/neural_network/tests -v

      - name: Run DFL container integration tests
        run: PYTHONPATH=. python -m unittest discover -s dfl/tests -v

  node-server:
    name: Node Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dfl/node_server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dfl/node_server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm test

  smart-contracts:
    name: Smart Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart_contracts
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.1

      - name: Show Foundry version
        run: forge --version

      - name: Set up Node.js for bootstrap tests
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Test smart-contract bootstrap helpers
        run: node --test test/*.test.mjs

      - name: Build contracts
        run: forge build

      - name: Run contract tests
        run: forge test -vvv

  docker-builds:
    name: Docker Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent
            context: .
            dockerfile: agent/Dockerfile
            image: agent
          - name: zk-inference
            context: .
            dockerfile: zk_inference/Dockerfile
            image: zk-inference
          - name: tee-inference
            context: .
            dockerfile: tee_inference/Dockerfile
            image: tee-inference
          - name: transparency-log
            context: transparency_log
            dockerfile: transparency_log/Dockerfile
            image: transparency-log
          - name: control-api
            context: .
            dockerfile: control_api/Dockerfile
            image: control-api
          - name: dfl-worker
            context: .
            dockerfile: dfl/Dockerfile
            image: dfl-worker
          - name: smart-contracts
            context: .
            dockerfile: smart_contracts/Dockerfile
            image: smart-contracts
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          load: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  runtime-smoke-test:
    name: Runtime Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start core runtime services
        run: docker compose --env-file .env.example --env-file .env.phala.anvil.example -f compose.yml up -d --build anvil ipfs zk-inference

      - name: Wait for Anvil JSON-RPC
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS \
              -H 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' \
              http://127.0.0.1:8545 >/tmp/anvil-health.json; then
              cat /tmp/anvil-health.json
              exit 0
            fi
            sleep 2
          done
          echo "Anvil did not become ready in time."
          exit 1

      - name: Wait for IPFS API
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS -X POST http://127.0.0.1:5001/api/v0/version >/tmp/ipfs-version.json; then
              cat /tmp/ipfs-version.json
              exit 0
            fi
            sleep 2
          done
          echo "IPFS API did not become ready in time."
          exit 1

      - name: Wait for zk-inference health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if docker compose --env-file .env.example --env-file .env.phala.anvil.example -f compose.yml exec -T zk-inference \
              curl -fsS http://127.0.0.1:8090/health >/tmp/zk-health.json; then
              cat /tmp/zk-health.json
              exit 0
            fi
            sleep 2
          done
          echo "zk-inference HTTP service did not become ready in time."
          exit 1

      - name: Show compose status
        if: always()
        run: docker compose --env-file .env.example --env-file .env.phala.anvil.example -f compose.yml ps

      - name: Show compose logs on failure
        if: failure()
        run: docker compose --env-file .env.example --env-file .env.phala.anvil.example -f compose.yml logs --no-color anvil ipfs zk-inference

      - name: Tear down runtime services
        if: always()
        run: docker compose --env-file .env.example --env-file .env.phala.anvil.example -f compose.yml down --volumes --remove-orphans
