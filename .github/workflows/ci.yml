name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  repo-hygiene:
    name: Repo Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose -f compose.yml config > /tmp/compose.expanded.yml

      - name: Check for unresolved merge markers
        run: |
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' \
            --exclude-dir=.git \
            --exclude-dir=smart_contracts/lib \
            --exclude-dir=data \
            --exclude-dir=agent/downloads \
            --exclude-dir=zk_inference/out \
            .; then
            echo "Unresolved merge markers detected."
            exit 1
          fi

  python-quality:
    name: Python Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python tooling and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r zk_inference/requirements.txt
          python -m pip install -r agent/requirements.txt
          python -m pip install -e dfl/neural_network

      - name: Run Ruff lint
        run: ruff check agent zk_inference dfl/neural_network

      - name: Check formatting
        run: ruff format --check agent zk_inference dfl/neural_network

      - name: Python syntax smoke check
        run: |
          python -m py_compile \
            agent/run_agent.py \
            agent/blockchain_source.py \
            agent/ipfs_rag.py \
            agent/zk_mcp_server.py \
            zk_inference/create_single_mnist_query.py \
            zk_inference/export_model.py \
            zk_inference/prepare_mnist_input.py \
            zk_inference/run_ezkl.py \
            zk_inference/server.py \
            zk_inference/service_tools.py \
            dfl/neural_network/cli.py \
            dfl/neural_network/service.py \
            dfl/neural_network/start_service.py

  node-server:
    name: Node Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dfl/node_server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dfl/node_server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm test

  smart-contracts:
    name: Smart Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart_contracts
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Foundry version
        run: forge --version

      - name: Build contracts
        run: forge build

  docker-builds:
    name: Docker Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent
            dockerfile: agent/Dockerfile
            image: thesis-agent-ci
          - name: zk-inference
            dockerfile: zk_inference/Dockerfile
            image: thesis-zk-inference-ci
          - name: dfl-worker
            dockerfile: dfl/Dockerfile
            image: thesis-dfl-worker-ci
          - name: smart-contracts
            dockerfile: smart_contracts/Dockerfile
            image: thesis-smart-contracts-ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: false
          tags: ${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  runtime-smoke-test:
    name: Runtime Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start core runtime services
        run: docker compose -f compose.yml up -d --build anvil ipfs zk-inference

      - name: Wait for Anvil JSON-RPC
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS \
              -H 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' \
              http://127.0.0.1:8545 >/tmp/anvil-health.json; then
              cat /tmp/anvil-health.json
              exit 0
            fi
            sleep 2
          done
          echo "Anvil did not become ready in time."
          exit 1

      - name: Wait for IPFS API
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS -X POST http://127.0.0.1:5001/api/v0/version >/tmp/ipfs-version.json; then
              cat /tmp/ipfs-version.json
              exit 0
            fi
            sleep 2
          done
          echo "IPFS API did not become ready in time."
          exit 1

      - name: Wait for zk-inference health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if docker compose -f compose.yml exec -T zk-inference \
              curl -fsS http://127.0.0.1:8090/health >/tmp/zk-health.json; then
              cat /tmp/zk-health.json
              exit 0
            fi
            sleep 2
          done
          echo "zk-inference HTTP service did not become ready in time."
          exit 1

      - name: Show compose status
        if: always()
        run: docker compose -f compose.yml ps

      - name: Show compose logs on failure
        if: failure()
        run: docker compose -f compose.yml logs --no-color anvil ipfs zk-inference

      - name: Tear down runtime services
        if: always()
        run: docker compose -f compose.yml down --volumes --remove-orphans
