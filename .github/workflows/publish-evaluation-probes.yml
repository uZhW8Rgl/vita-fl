name: Publish Dedicated Evaluation Probes
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
on:
  push:
    branches: [phala_app_key]
    paths: ["evaluation/phala-key-probe/**", ".github/workflows/publish-evaluation-probes.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [approved-a, approved-b, unapproved]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci && npm run build
        working-directory: dfl/node_server
      - run: node --test evaluation/phala-key-probe/server.test.mjs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: evaluation/phala-key-probe/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: VARIANT=${{ matrix.variant }}
          # Reuse the existing public package; these tags are never deployment pins.
          tags: ghcr.io/uzhw8rgl/master-thesis-dfl-worker:chapter7-probe-${{ matrix.variant }}-${{ github.sha }}
      - name: Record immutable image reference
        run: echo "PROBE_IMAGE_${{ matrix.variant }}=ghcr.io/uzhw8rgl/master-thesis-dfl-worker@${{ steps.build.outputs.digest }}"
