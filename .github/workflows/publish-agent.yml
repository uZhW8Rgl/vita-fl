name: Publish Phala Agent

on:
  push:
    branches:
      - tee_inference
      - phala_app_key
    paths:
      - "agent/**"
      - "agent_receipts/**"
      - "tee_inference/air/**"
      - "tee_inference/protocol/**"
      - "tee_inference/vectors/**"
      - "data/chestmnist/test_data/test-data.npz"
      - ".github/workflows/publish-agent.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: Container tag
        required: true
        default: agent

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  REGISTRY: ghcr.io
  IMAGE_NAME: uzhw8rgl/master-thesis-agent

jobs:
  publish:
    name: Test, build and publish Agent
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Test agent
        run: |
          python -m pip install -r agent/requirements.txt
          PYTHONPATH=. python -m unittest discover -s agent/tests -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Agent image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: agent/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.tag || 'agent' }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,scope=agent,mode=max

      - name: Publish digest-pinned reference
        run: |
          echo "Image tag:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.tag || 'agent' }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Digest-pinned reference for Phala/Terraform:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy published image to Phala
    needs: publish
    if: >-
      vars.PHALA_AUTO_DEPLOY == 'true' &&
      github.ref_type == 'branch' &&
      github.ref_name == (vars.PHALA_DEPLOY_BRANCH || 'phala_app_key')
    uses: ./.github/workflows/deploy-phala.yml
    permissions:
      contents: write
      packages: read
    with:
      image-variable: agent_image
      image-reference: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
      revision: ${{ github.sha }}
    secrets: inherit
