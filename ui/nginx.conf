server {
    listen 8080;
    server_name _;
    resolver 127.0.0.11 ipv6=off;
    access_log off;

    root /usr/share/nginx/html;
    index index.html;
    auth_basic "Master Thesis DFL";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location = /favicon.ico {
        add_header Content-Type text/plain;
        return 204;
    }

    location /api/ {
        set $agent_api http://agent:8089;
        proxy_pass $agent_api;
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_send_timeout 1200s;
        proxy_read_timeout 1200s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/control/ {
        set $control_api http://control-api:8091;
        proxy_pass $control_api;
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_send_timeout 1200s;
        proxy_read_timeout 1200s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Control-Admin-Token "__CONTROL_ADMIN_TOKEN__";
    }

    location /api/training/ {
        set $control_api http://control-api:8091;
        proxy_pass $control_api;
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_send_timeout 1200s;
        proxy_read_timeout 1200s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Control-Admin-Token "__CONTROL_ADMIN_TOKEN__";
    }

    location /api/observability/ {
        set $control_api http://control-api:8091;
        proxy_pass $control_api;
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_send_timeout 1200s;
        proxy_read_timeout 1200s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Control-Admin-Token "__CONTROL_ADMIN_TOKEN__";
    }

    location /grafana/ {
        set $grafana http://grafana:3000;
        proxy_pass $grafana;
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect ~^https?://[^/]+(/grafana/.*)$ $scheme://$http_host$1;
    }

    location = /ui-health {
        auth_basic off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /health {
        set $agent_api http://agent:8089;
        proxy_pass $agent_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
