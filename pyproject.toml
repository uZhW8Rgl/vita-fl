[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
]

[tool.ruff.lint.per-file-ignores]
"agent/blockchain_source.py" = ["I001"]
"agent/ipfs_bundle.py" = ["I001"]
"agent/run_agent.py" = ["I001"]
"agent/mcp_server.py" = ["I001"]
"data/mnist_tools.py" = ["E402", "I001"]
"dfl/neural_network/start_service.py" = ["E402", "I001"]
"dfl/neural_network/service.py" = ["I001"]
"zk_inference/create_single_mnist_query.py" = ["E402", "I001"]
"zk_inference/server.py" = ["I001"]
"zk_inference/service_tools.py" = ["I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
