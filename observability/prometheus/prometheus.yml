global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: control-api
    static_configs:
      - targets: ["control-api:8091"]

  - job_name: agent
    metrics_path: /metrics
    static_configs:
      - targets: ["agent:8089"]
