    environment:
      <<: *worker-env
      ACCOUNT_ADDRESS: ${W4_ACCOUNT_ADDRESS}
      PRIVATE_KEY: ${W4_PRIVATE_KEY}
      DEVICE_ID: ${W4_DEVICE_ID}
      TRAIN_IMAGES_SRC: /dfl/config/training_data/train-images-4.idx3-ubyte
