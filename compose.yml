---
x-worker-build: &worker-build
  context: .
  dockerfile: dfl/Dockerfile

x-worker-env: &worker-env
  API_KEY: ${API_KEY}
  API_SECRET: ${API_SECRET}
  PINATA_JWT: ${PINATA_JWT}
  IPFS_GATEWAY: ${IPFS_GATEWAY}
  KUBO_API: ${KUBO_API}
  KUBO_GATEWAY: ${KUBO_GATEWAY}
  IPFS_FETCH_TIMEOUT_MS: ${IPFS_FETCH_TIMEOUT_MS:-30000}
  IPFS_PROVIDER: ${IPFS_PROVIDER}
  DOCKER: ${DOCKER}
  LOCAL_TDX_MOCK: ${LOCAL_TDX_MOCK:-1}
  LOCAL_TDX_IMAGE_DIGEST: ${LOCAL_TDX_IMAGE_DIGEST:-0x7849ee527ff2efc746c58f67cd6336572d5c71743c608bbd3810079289c7c066}
  REGISTRY_ADDRESS: ${REGISTRY_ADDRESS}
  AGGREGATOR_ADDRESS: ${AGGREGATOR_ADDRESS}
  GM_STORAGE_ADDRESS: ${GM_STORAGE_ADDRESS}
  MEDICAL_SIGNER_REGISTRY_ADDRESS: ${MEDICAL_SIGNER_REGISTRY_ADDRESS:-}
  EXPECTED_DEVICE_REGISTRY_ADDRESS: ${EXPECTED_DEVICE_REGISTRY_ADDRESS:-0x5FbDB2315678afecb367f032d93F642f64180aa3}
  EXPECTED_AGGREGATOR_ADDRESS: ${EXPECTED_AGGREGATOR_ADDRESS:-0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512}
  EXPECTED_GM_STORAGE_ADDRESS: ${EXPECTED_GM_STORAGE_ADDRESS:-0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0}
  EXPECTED_MEDICAL_SIGNER_REGISTRY_ADDRESS: ${EXPECTED_MEDICAL_SIGNER_REGISTRY_ADDRESS:-0xCf7Ed3AccA5a467e9e704C703E8D87F634fB0Fc9}
  EXPECTED_CHAIN_ID: ${EXPECTED_CHAIN_ID:-31337}
  RPC_URL: ${RPC_URL}
  GM_UPDATE_TIMEOUT_MS: ${GM_UPDATE_TIMEOUT_MS:-30000}
  GM_UPDATE_TIMEOUT_LOOPS: ${GM_UPDATE_TIMEOUT_LOOPS:-4}
  AGGREGATION_UPDATE_ESTIMATE_MS: ${AGGREGATION_UPDATE_ESTIMATE_MS:-30000}
  GM_UPDATE_POLL_MS: ${GM_UPDATE_POLL_MS:-5000}
  MODEL_TRANSFER_TIMEOUT_MS: ${MODEL_TRANSFER_TIMEOUT_MS:-20000}
  MODEL_TRANSFER_RETRY_DELAY_MS: ${MODEL_TRANSFER_RETRY_DELAY_MS:-5000}
  EPOCH: ${EPOCH}
  ROUND: ${ROUND}
  ETH_EUR_PRICE: ${ETH_EUR_PRICE:-3000}
  ETH_USD_PRICE: ${ETH_USD_PRICE:-}
  EXCHANGE_RATE_SOURCE: ${EXCHANGE_RATE_SOURCE:-manual_configuration}
  EXCHANGE_RATE_TIMESTAMP_UTC: ${EXCHANGE_RATE_TIMESTAMP_UTC:-}
  REFERENCE_MAINNET_GAS_PRICE_GWEI: ${REFERENCE_MAINNET_GAS_PRICE_GWEI:-}
  REFERENCE_GAS_PRICE_SOURCE: ${REFERENCE_GAS_PRICE_SOURCE:-}
  REFERENCE_GAS_PRICE_TIMESTAMP_UTC: ${REFERENCE_GAS_PRICE_TIMESTAMP_UTC:-}
  PYTHON_SERVICE_URL: http://127.0.0.1:8000
  TDX_QUOTE_PATH: /dfl/node_server/attestation/phala_tdx_quote
  DATASET_NAME: ${DATASET_NAME:-mnist}
  TEST_DATA_SRC: /dfl/config/chestmnist/test_data/test-data.npz
  CHESTMNIST_TRAINING_METADATA_PATH: /dfl/config/chestmnist/training-metadata.json
  DFL_MODEL_SEED: ${DFL_MODEL_SEED:-42}
  DFL_TRAIN_SEED: ${DFL_TRAIN_SEED:-42}
  DFL_TRAIN_OPTIMIZER: ${DFL_TRAIN_OPTIMIZER:-}
  DFL_TRAIN_LEARNING_RATE: ${DFL_TRAIN_LEARNING_RATE:-}
  DFL_TRAIN_LR_SCHEDULE: ${DFL_TRAIN_LR_SCHEDULE:-constant}
  DFL_TRAIN_LR_DECAY_START_ROUND: ${DFL_TRAIN_LR_DECAY_START_ROUND:-20}
  DFL_TRAIN_LR_FINAL_FACTOR: ${DFL_TRAIN_LR_FINAL_FACTOR:-0.25}
  DFL_TRAIN_WEIGHT_DECAY: ${DFL_TRAIN_WEIGHT_DECAY:-}
  DFL_GRAD_CLIP_NORM: ${DFL_GRAD_CLIP_NORM:-5}
  DFL_POS_WEIGHT_CAP: ${DFL_POS_WEIGHT_CAP:-10}
  # Local multi-container runs share the host CPU. Phala tdx.small templates
  # intentionally omit these limits because the CVM already has one vCPU.
  DFL_TORCH_NUM_THREADS: ${DFL_TORCH_NUM_THREADS:-1}
  DFL_TORCH_INTEROP_THREADS: ${DFL_TORCH_INTEROP_THREADS:-1}
  OMP_NUM_THREADS: ${OMP_NUM_THREADS:-1}
  MKL_NUM_THREADS: ${MKL_NUM_THREADS:-1}
  OPENBLAS_NUM_THREADS: ${OPENBLAS_NUM_THREADS:-1}
  DFL_EXPERIMENT_ID: ${DFL_EXPERIMENT_ID:-local}
  DFL_EVAL_WRITE_SAMPLE_METRICS: ${DFL_EVAL_WRITE_SAMPLE_METRICS:-1}
  PARTICIPANT_KEY_PROVIDER: file

x-worker-common: &worker-common
  build: *worker-build
  image: ghcr.io/uzhw8rgl/master-thesis-dfl-worker:latest
  pull_policy: never
  platform: linux/amd64
  profiles: ["runtime"]
  depends_on:
    anvil:
      condition: service_healthy
    ipfs:
      condition: service_healthy
  volumes:
    - ./data/evaluation:/dfl/node_server/data/evaluation
    # Development-only key material. Production images contain no private keys.
    - ./data/rsa_keys:/dfl/keys:ro
  command: ["/dfl/start_node_neural_network.sh"]

services:
  grafana:
    image: grafana/grafana:11.6.0
    container_name: ${GRAFANA_CONTAINER_NAME:-master-thesis-grafana}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_LOG_LEVEL: warn
      GF_LOG_FILTERS: authn.service:error
    ports:
      - "${GRAFANA_BIND_ADDRESS:-0.0.0.0}:${GRAFANA_HOST_PORT:-3300}:3000"
    tmpfs:
      - /var/lib/grafana:size=256m,mode=1777
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    restart: unless-stopped
    user: "0"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=24h
      - --web.enable-remote-write-receiver
      - --log.level=warn
    ports:
      - "127.0.0.1:9090:9090"
    tmpfs:
      - /prometheus:size=1024m,mode=1777
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  anvil:
    image: ghcr.io/foundry-rs/foundry:${FOUNDRY_IMAGE_TAG:-nightly-dd0a687aa36ec731b6ea2cda2aa4f32e192814fa}
    container_name: anvil
    environment:
      ANVIL_IP_ADDR: "0.0.0.0"
      FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
      ANVIL_HARDFORK: ${ANVIL_HARDFORK:-osaka}
    working_dir: /anvil
    ports:
      - "8545:8545"
    entrypoint:
      - anvil
    command:
      - --quiet
      - --accounts
      - ${ANVIL_ACCOUNT_COUNT:-6}
      - --hardfork
      - ${ANVIL_HARDFORK:-osaka}
      - --code-size-limit
      - "999999"
      - --gas-limit
      - "1000000000"
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/8545' >/dev/null 2>&1 || exit 1"]
      interval: 2s
      timeout: 1s
      retries: 15

  ipfs:
    image: ipfs/kubo:latest
    container_name: ipfs_local
    restart: unless-stopped
    environment:
      IPFS_TELEMETRY: "off"
    ports:
      - "127.0.0.1:4001:4001"
      - "127.0.0.1:5001:5001"
      - "127.0.0.1:8080:8080"
    tmpfs:
      - /data/ipfs
    volumes:
      - ./ipfs-disable-version-check.sh:/container-init.d/001-disable-version-check.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "ipfs id >/dev/null 2>&1 || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 30

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    profiles: ["runtime"]
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ./ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep '[o]llama serve' >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    profiles: ["runtime"]
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        ollama pull gemma4:e2b
        # Smaller local fallback:
        # ollama pull llama3.2
        # ollama pull qwen3:0.6b
    volumes:
      - ./ollama-data:/root/.ollama

  smart-contracts:
    build:
      context: .
      dockerfile: smart_contracts/Dockerfile
      args:
        FOUNDRY_VERSION: ${FOUNDRY_IMAGE_TAG:-nightly-dd0a687aa36ec731b6ea2cda2aa4f32e192814fa}
    image: ghcr.io/uzhw8rgl/master-thesis-smart-contracts:latest
    container_name: smart-contracts
    platform: linux/amd64
    restart: "no"
    depends_on:
      anvil:
        condition: service_healthy
      ipfs:
        condition: service_healthy
    environment:
      FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
      IPFS_PROVIDER: ${IPFS_PROVIDER}
      DOCKER: ${DOCKER}
      LOCAL_TDX_MOCK: ${LOCAL_TDX_MOCK:-1}
      LOCAL_TDX_IMAGE_DIGEST: ${LOCAL_TDX_IMAGE_DIGEST:-0x7849ee527ff2efc746c58f67cd6336572d5c71743c608bbd3810079289c7c066}
      TRAINING_WORKER_POLICY_APP_COMPOSE_B64: ${TRAINING_WORKER_POLICY_APP_COMPOSE_B64:-}
      INFERENCE_WORKER_POLICY_APP_COMPOSE_B64: ${INFERENCE_WORKER_POLICY_APP_COMPOSE_B64:-}
      ETH_WALLET_PRIVATE_KEY: ${W0_PRIVATE_KEY}
      PCCS_FMSPC: ${PCCS_FMSPC:-20A06F000000}
      PCCS_FETCH: ${PCCS_FETCH:-1}
      PCCS_TEE: ${PCCS_TEE:-tdx}
      P256_MODE: ${P256_MODE:-native}
      P256_VERIFIER_ADDRESS: ${P256_VERIFIER_ADDRESS:-}
      DEPLOY_TDX_V4_DCAP: ${DEPLOY_TDX_V4_DCAP:-1}
      VERIFY_TDX_QUOTE_ONCHAIN: ${VERIFY_TDX_QUOTE_ONCHAIN:-1}
      AGGREGATOR_TIMEOUT_REPORT_PERCENT: ${AGGREGATOR_TIMEOUT_REPORT_PERCENT:-50}
      PCCS_QUOTE_PATH: ${PCCS_QUOTE_PATH:-../data/phala_tdx_quote}
      TDX_REFERENCE_QUOTE_PATH: ${TDX_REFERENCE_QUOTE_PATH:-../data/dstack-dev-0.5.9-de9c74f0-reference-tdx-quote}
      DATASET_NAME: ${DATASET_NAME:-mnist}
      INITIAL_GM_CID: ${INITIAL_GM_CID}
      CLIENT_LIMIT: ${CLIENT_LIMIT:-5}
      MODEL_SUBMISSION_DEADLINE_MS: ${MODEL_SUBMISSION_DEADLINE_MS:-60000}
      WORKER_COUNT: ${WORKER_COUNT:-6}
      WORKER_ACCOUNT_ADDRESSES: ${WORKER_ACCOUNT_ADDRESSES:-}
      W0_ACCOUNT_ADDRESS: ${W0_ACCOUNT_ADDRESS}
      W1_ACCOUNT_ADDRESS: ${W1_ACCOUNT_ADDRESS}
      W2_ACCOUNT_ADDRESS: ${W2_ACCOUNT_ADDRESS}
      W3_ACCOUNT_ADDRESS: ${W3_ACCOUNT_ADDRESS}
      W4_ACCOUNT_ADDRESS: ${W4_ACCOUNT_ADDRESS}
      W5_ACCOUNT_ADDRESS: ${W5_ACCOUNT_ADDRESS}
      W6_ACCOUNT_ADDRESS: ${W6_ACCOUNT_ADDRESS}
      W7_ACCOUNT_ADDRESS: ${W7_ACCOUNT_ADDRESS}
      W8_ACCOUNT_ADDRESS: ${W8_ACCOUNT_ADDRESS}
      W9_ACCOUNT_ADDRESS: ${W9_ACCOUNT_ADDRESS}
      W10_ACCOUNT_ADDRESS: ${W10_ACCOUNT_ADDRESS}
      W11_ACCOUNT_ADDRESS: ${W11_ACCOUNT_ADDRESS}
      W12_ACCOUNT_ADDRESS: ${W12_ACCOUNT_ADDRESS}
      W13_ACCOUNT_ADDRESS: ${W13_ACCOUNT_ADDRESS}
      W14_ACCOUNT_ADDRESS: ${W14_ACCOUNT_ADDRESS}
      W15_ACCOUNT_ADDRESS: ${W15_ACCOUNT_ADDRESS}
      W16_ACCOUNT_ADDRESS: ${W16_ACCOUNT_ADDRESS}
      W17_ACCOUNT_ADDRESS: ${W17_ACCOUNT_ADDRESS}
      W18_ACCOUNT_ADDRESS: ${W18_ACCOUNT_ADDRESS}
      W19_ACCOUNT_ADDRESS: ${W19_ACCOUNT_ADDRESS}
      ETH_EUR_PRICE: ${ETH_EUR_PRICE:-3000}
      ETH_USD_PRICE: ${ETH_USD_PRICE:-}
      EXCHANGE_RATE_SOURCE: ${EXCHANGE_RATE_SOURCE:-manual_configuration}
      EXCHANGE_RATE_TIMESTAMP_UTC: ${EXCHANGE_RATE_TIMESTAMP_UTC:-}
      REFERENCE_MAINNET_GAS_PRICE_GWEI: ${REFERENCE_MAINNET_GAS_PRICE_GWEI:-}
      REFERENCE_GAS_PRICE_SOURCE: ${REFERENCE_GAS_PRICE_SOURCE:-}
      REFERENCE_GAS_PRICE_TIMESTAMP_UTC: ${REFERENCE_GAS_PRICE_TIMESTAMP_UTC:-}
    command: ["bash", "/dfl/smart_contracts/starter_docker.sh"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/evaluation:/dfl/data/evaluation

  transparency-log:
    build:
      context: ./transparency_log
      args:
        SCITT_COMMIT: b6ebc0518b59795147538bcc0cc7f67079a82d63
        CCF_VERSION: 7.0.6
        AZURE_LINUX_TAG: 3.0.20260616
    image: master-thesis-transparency-log:scitt-0.18.1
    container_name: master-thesis-transparency-log
    profiles: ["runtime"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SCITT_HOST_PORT:-8000}:8000"
    volumes:
      - scitt-data:/data

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    image: master-thesis-agent:dev
    pull_policy: never
    container_name: agent
    profiles: ["runtime"]
    restart: unless-stopped
    depends_on:
      transparency-log:
        condition: service_healthy
    working_dir: /app
    environment:
      DOCKER: "1"
      DATASET_NAME: ${DATASET_NAME:-mnist}
      PYTHONUNBUFFERED: "1"
      RPC_URL: http://anvil:8545
      IPFS_API_URL: http://ipfs:5001
      ZK_INFERENCE_URL: http://zk-inference:8090
      # OLLAMA_BASE_URL: http://ollama:11434
      # OLLAMA_MODEL: gemma4:e2b
      # Remote Ollama fallback:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://elise.ise.tu-berlin.de:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e2b}
      OLLAMA_NUM_PREDICT: "128"
      AGENT_CHAT_TIMEOUT_SECONDS: "360"
      GM_STORAGE_ADDRESS: 0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0
      REGISTRY_ADDRESS: 0x5FbDB2315678afecb367f032d93F642f64180aa3
      EXPECTED_GM_STORAGE_ADDRESS: ${EXPECTED_GM_STORAGE_ADDRESS:-0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0}
      EXPECTED_DEVICE_REGISTRY_ADDRESS: ${EXPECTED_DEVICE_REGISTRY_ADDRESS:-0x5FbDB2315678afecb367f032d93F642f64180aa3}
      EXPECTED_CHAIN_ID: ${EXPECTED_CHAIN_ID:-31337}
      EXPECTED_RUNTIME_RPC_URL: ${EXPECTED_RUNTIME_RPC_URL:-http://anvil:8545}
      ACCOUNT_ADDRESS: ${W0_ACCOUNT_ADDRESS}
      RSA_PRIVATE_KEY_FILE: /dfl/keys/private_key.pem
      RSA_PUBLIC_KEY_FILE: /dfl/keys/public_key.pem
      AGENT_PORT: "8089"
      TEE_INFERENCE_URL: ${TEE_INFERENCE_URL:-https://181195df89a143ecaf3d38b2cf0fcb8a30310f07-8080.dstack-pha-prod9.phala.network}
      TEE_INFERENCE_IMAGE_DIGEST: ${TEE_INFERENCE_IMAGE_DIGEST:-sha256:8a8a3d2f8fae058ef6dc274bc80e9206858930a67d32f11e586aa6d7d4944c7d}
      SCITT_URL: https://transparency-log:8000
      SCITT_DEVELOPMENT: "1"
      SCITT_SIGNER_DIR: /app/agent/state/scitt
      SCITT_TRANSPARENT_STATEMENT_PATH: /app/tee_inference/out/latest-transparent-statement.cose
      TEE_INFERENCE_EVIDENCE_PATH: /app/tee_inference/out/latest-evidence.cbor
    command:
      - python
      - agent/run_agent.py
      - --serve
      - --llm
      - --source
      - contract
      - --rpc-url
      - http://anvil:8545
      - --gm-storage-address
      - 0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0
      - --registry-address
      - 0x5FbDB2315678afecb367f032d93F642f64180aa3
      - --ipfs-api-url
      - http://ipfs:5001
      - --zk-inference-url
      - http://zk-inference:8090
      - --skip-calibration
    volumes:
      - ./agent/downloads:/app/agent/downloads
      - ./data/rsa_keys:/dfl/keys:ro
      - ./tee_inference/out:/app/tee_inference/out
      - agent-scitt-state:/app/agent/state/scitt

  control-api:
    build:
      context: .
      dockerfile: control_api/Dockerfile
    image: ghcr.io/uzhw8rgl/master-thesis-control-api:latest
    platform: linux/amd64
    container_name: control-api
    restart: unless-stopped
    working_dir: /app
    environment:
      PWD: ${PWD}
      TRAINING_WORKSPACE_ROOT: ${PWD}
      TRAINING_ENV_FILE: ${TRAINING_ENV_FILE:-.env}
      TRAINING_COMPOSE_ENV_FILE: ${TRAINING_COMPOSE_ENV_FILE:-.env}
      TRAINING_COMPOSE_BIN: docker-compose
      TRAINING_COMPOSE_PROJECT_NAME: master-thesis
      TRAINING_COMPOSE_PROFILE: runtime
      CONTROL_API_PORT: "8091"
    command:
      - python
      - control_api/server.py
    volumes:
      - ./:${PWD}
      - /var/run/docker.sock:/var/run/docker.sock

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    image: ghcr.io/uzhw8rgl/master-thesis-ui:latest
    container_name: ui
    restart: unless-stopped
    environment:
      GRAFANA_EXTERNAL_DASHBOARD_URL: ${GRAFANA_EXTERNAL_DASHBOARD_URL:-http://localhost:3300/public-dashboards/c656176f25ca4408a109731176af6da4}
      GRAFANA_CONTRACT_DASHBOARD_URL: ${GRAFANA_CONTRACT_DASHBOARD_URL:-http://localhost:3300/d/dfl-contract-init-overview/dfl-contract-init-overview?kiosk}
      GRAFANA_TRAINING_DASHBOARD_URL: ${GRAFANA_TRAINING_DASHBOARD_URL:-http://localhost:3300/d/dfl-training-overview/dfl-training-overview?kiosk}
      GRAFANA_AGENT_DASHBOARD_URL: ${GRAFANA_AGENT_DASHBOARD_URL:-http://localhost:3300/d/agent-mcp-tool-usage/agent-mcp-tool-usage?kiosk}
      UI_BASIC_AUTH_USERNAME: ${UI_BASIC_AUTH_USERNAME:-admin}
      UI_BASIC_AUTH_PASSWORD: ${UI_BASIC_AUTH_PASSWORD:-admin}
    depends_on:
      grafana:
        condition: service_started
      control-api:
        condition: service_started
    ports:
      - "${UI_BIND_ADDRESS:-0.0.0.0}:${UI_HOST_PORT:-8089}:8080"

  zk-inference:
    build:
      context: .
      dockerfile: zk_inference/Dockerfile
    image: ghcr.io/uzhw8rgl/master-thesis-zk-inference:latest
    platform: linux/amd64
    container_name: zk-inference
    profiles: ["runtime"]
    restart: unless-stopped
    working_dir: /app
    environment:
      DATASET_NAME: ${DATASET_NAME:-mnist}
      PYTHONUNBUFFERED: "1"
      ZK_INFERENCE_HOST: 0.0.0.0
      ZK_INFERENCE_PORT: "8090"
    volumes:
      - ./agent/downloads:/app/agent/downloads
      - ./zk_inference/out:/app/zk_inference/out
      - ./zk_inference/single_query:/app/zk_inference/single_query

  VM-0:
    <<: *worker-common
    container_name: ${W0_ACCOUNT_ADDRESS}
    environment:
      <<: *worker-env
      ACCOUNT_ADDRESS: ${W0_ACCOUNT_ADDRESS}
      PRIVATE_KEY: ${W0_PRIVATE_KEY}
      DEVICE_ID: ${W0_DEVICE_ID}
      TRAIN_IMAGES_SRC: /dfl/config/training_data/train-images-0.idx3-ubyte
      TRAIN_LABELS_SRC: /dfl/config/training_data/train-labels-0.idx1-ubyte
      TRAIN_DATA_SRC: /dfl/config/chestmnist/training_data/train-data-0.npz
      RSA_PRIVATE_KEY_FILE: /dfl/keys/private_key.pem
      RSA_PUBLIC_KEY_FILE: /dfl/keys/public_key.pem

  VM-1:
    <<: *worker-common
    container_name: ${W1_ACCOUNT_ADDRESS}
    environment:
      <<: *worker-env
      ACCOUNT_ADDRESS: ${W1_ACCOUNT_ADDRESS}
      PRIVATE_KEY: ${W1_PRIVATE_KEY}
      DEVICE_ID: ${W1_DEVICE_ID}
      TRAIN_IMAGES_SRC: /dfl/config/training_data/train-images-1.idx3-ubyte
      TRAIN_LABELS_SRC: /dfl/config/training_data/train-labels-1.idx1-ubyte
      TRAIN_DATA_SRC: /dfl/config/chestmnist/training_data/train-data-1.npz
      RSA_PRIVATE_KEY_FILE: /dfl/keys/private_key_1.pem
      RSA_PUBLIC_KEY_FILE: /dfl/keys/public_key_1.pem

  VM-2:
    <<: *worker-common
    container_name: ${W2_ACCOUNT_ADDRESS}
    environment:
      <<: *worker-env
      ACCOUNT_ADDRESS: ${W2_ACCOUNT_ADDRESS}
      PRIVATE_KEY: ${W2_PRIVATE_KEY}
      DEVICE_ID: ${W2_DEVICE_ID}
      TRAIN_IMAGES_SRC: /dfl/config/training_data/train-images-2.idx3-ubyte
      TRAIN_LABELS_SRC: /dfl/config/training_data/train-labels-2.idx1-ubyte
      TRAIN_DATA_SRC: /dfl/config/chestmnist/training_data/train-data-2.npz
      RSA_PRIVATE_KEY_FILE: /dfl/keys/private_key_2.pem
      RSA_PUBLIC_KEY_FILE: /dfl/keys/public_key_2.pem

  VM-3:
    <<: *worker-common
    container_name: ${W3_ACCOUNT_ADDRESS}
    environment:
      <<: *worker-env
      ACCOUNT_ADDRESS: ${W3_ACCOUNT_ADDRESS}
      PRIVATE_KEY: ${W3_PRIVATE_KEY}
      DEVICE_ID: ${W3_DEVICE_ID}
