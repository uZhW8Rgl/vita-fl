      TRAIN_DATA_SRC: /dfl/config/chestmnist/training_data/train-data-6.npz
      RSA_PRIVATE_KEY_FILE: /dfl/keys/private_key_6.pem
      RSA_PUBLIC_KEY_FILE: /dfl/keys/public_key_6.pem

  VM-7:
    <<: *worker-common
    container_name: ${W7_ACCOUNT_ADDRESS}
    environment:
      <<: *worker-env
      ACCOUNT_ADDRESS: ${W7_ACCOUNT_ADDRESS}
      PRIVATE_KEY: ${W7_PRIVATE_KEY}
