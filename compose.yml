      TRAIN_IMAGES_SRC: /dfl/config/training_data/train-images-7.idx3-ubyte
      TRAIN_LABELS_SRC: /dfl/config/training_data/train-labels-7.idx1-ubyte
      TRAIN_DATA_SRC: /dfl/config/chestmnist/training_data/train-data-7.npz
      RSA_PRIVATE_KEY_FILE: /dfl/keys/private_key_7.pem
