      TRAIN_LABELS_SRC: /dfl/config/training_data/train-labels-3.idx1-ubyte
      TRAIN_DATA_SRC: /dfl/config/chestmnist/training_data/train-data-3.npz
      RSA_PRIVATE_KEY_FILE: /dfl/keys/private_key_3.pem
      RSA_PUBLIC_KEY_FILE: /dfl/keys/public_key_3.pem

