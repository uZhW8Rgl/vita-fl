      TRAIN_IMAGES_SRC: /dfl/config/training_data/train-images-5.idx3-ubyte
      TRAIN_LABELS_SRC: /dfl/config/training_data/train-labels-5.idx1-ubyte
      TRAIN_DATA_SRC: /dfl/config/chestmnist/training_data/train-data-5.npz
      RSA_PRIVATE_KEY_FILE: /dfl/keys/private_key_5.pem
      RSA_PUBLIC_KEY_FILE: /dfl/keys/public_key_5.pem

  VM-6:
