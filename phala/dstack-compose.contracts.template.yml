services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:nightly-dd0a687aa36ec731b6ea2cda2aa4f32e192814fa
    restart: unless-stopped
    environment:
      ANVIL_IP_ADDR: "0.0.0.0"
      FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
    entrypoint:
      - anvil
    command:
      - --quiet
      - --accounts
      - "20"
      - --hardfork
      - osaka
      - --code-size-limit
      - "999999"
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 5s
      timeout: 3s
      retries: 24

  rpc-proxy:
    image: ghcr.io/uzhw8rgl/master-thesis-smart-contracts@sha256:ecca24e8dbafbf978acdad4941b25611994d734c2087cc603399e4a44e42540f
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      anvil:
        condition: service_healthy
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      RPC_PROXY_UPSTREAM: http://anvil:8545
    command: ["python3", "/dfl/smart_contracts/rpc_proxy.py"]
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8545/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 24

  ipfs:
    image: ipfs/kubo:latest
    restart: unless-stopped
    environment:
      IPFS_TELEMETRY: "off"
    ports:
      - "5001:5001"
      - "8080:8080"
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 5s
      timeout: 5s
      retries: 24

  smart-contracts:
    image: ghcr.io/uzhw8rgl/master-thesis-smart-contracts@sha256:ecca24e8dbafbf978acdad4941b25611994d734c2087cc603399e4a44e42540f
    restart: "no"
    depends_on:
      anvil:
        condition: service_healthy
      ipfs:
        condition: service_healthy
    environment:
      DOCKER: phala
      RPC_URL: http://anvil:8545
      KUBO_API_URL: http://ipfs:5001
      IPFS_PROVIDER: kubo
      KEEP_ALIVE: "0"
      # Supply these through Phala's encrypted environment.
      ETH_WALLET_PRIVATE_KEY:
      INITIAL_GM_SIGNING_KEY:
      INITIAL_BOOTSTRAP_RECIPIENT_PUBLIC_KEY:
      PCCS_FMSPC: "20A06F000000"
      PCCS_FETCH: "1"
      PCCS_TEE: tdx
      P256_MODE: fallback
      DEPLOY_TDX_V4_DCAP: "1"
      VERIFY_TDX_QUOTE_ONCHAIN: "1"
      AGGREGATOR_TIMEOUT_REPORT_PERCENT: "50"
      EXPECTED_WORKER_IMAGE: "ghcr.io/uzhw8rgl/master-thesis-dfl-worker@sha256:ea37c012d57ab7fb5cc3a872b035b8556bded8764636db97d19f6e73b720d341"
      PCCS_QUOTE_PATH: /dfl/data/phala_tdx_quote
      TDX_REFERENCE_QUOTE_PATH: ""
      PHALA_COMPOSE_PATH: /dfl/phala/dstack-compose.template.yml
      PHALA_APP_CODE_PATH: /dfl/phala/app_code.txt
      PHALA_RTMR3_EVENT_LOG_PATH: /dfl/phala/rtmr3_event_log.txt
      PHALA_RTMR3_EVENT_DIGESTS: ""
      PHALA_ENFORCE_COMPOSE_HASH: "0"
      PHALA_ALLOWED_WORKER_COMPOSE_HASHES: "REPLACE_WITH_COMMA_SEPARATED_COMPOSE_HASHES"
      DATASET_NAME: mnist
      W0_ACCOUNT_ADDRESS: "REPLACE_WITH_WORKER_ADDRESS"
      W1_ACCOUNT_ADDRESS: "REPLACE_WITH_WORKER_ADDRESS"
      WORKER_ACCOUNT_ADDRESSES: "REPLACE_WITH_WORKER0_ADDRESS,REPLACE_WITH_WORKER1_ADDRESS,REPLACE_WITH_WORKER2_ADDRESS"
      WORKER_ACCOUNT_BALANCE_WEI: "10000000000000000000000"
      INITIAL_GM_SIGNER_ADDRESS: "REPLACE_WITH_WORKER_ADDRESS"
    command: ["bash", "/dfl/smart_contracts/starter_docker.sh"]
