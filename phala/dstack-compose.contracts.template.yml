services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:nightly-dd0a687aa36ec731b6ea2cda2aa4f32e192814fa
    restart: unless-stopped
    environment:
      ANVIL_IP_ADDR: "0.0.0.0"
      FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
    entrypoint:
      - anvil
    command:
      - --quiet
      - --accounts
      - "500"
      - --hardfork
      - osaka
      - --code-size-limit
      - "999999"
      - --gas-limit
      - "1000000000"
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 5s
      timeout: 3s
      retries: 24

  rpc-proxy:
    image: ghcr.io/uzhw8rgl/master-thesis-smart-contracts@sha256:b09465bb1c1dbd54b7ad527e1ec66c9c74463f600ea86e53fa65673501a394f0
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      anvil:
        condition: service_healthy
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      RPC_PROXY_UPSTREAM: http://anvil:8545
    command: ["python3", "/dfl/smart_contracts/rpc_proxy.py"]
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8545/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 24

  ipfs:
    image: ipfs/kubo:latest
    restart: unless-stopped
    environment:
      IPFS_TELEMETRY: "off"
    ports:
      - "5001:5001"
      - "8080:8080"
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 5s
      timeout: 5s
      retries: 24

  smart-contracts:
    image: ghcr.io/uzhw8rgl/master-thesis-smart-contracts@sha256:b09465bb1c1dbd54b7ad527e1ec66c9c74463f600ea86e53fa65673501a394f0
    restart: "no"
    depends_on:
      anvil:
        condition: service_healthy
      ipfs:
        condition: service_healthy
    environment:
      DOCKER: phala
      RPC_URL: http://anvil:8545
      KUBO_API_URL: http://ipfs:5001
      IPFS_PROVIDER: kubo
      # Supply these through Phala's encrypted environment.
      ETH_WALLET_PRIVATE_KEY: "${ETH_WALLET_PRIVATE_KEY}"
      CLIENT_LIMIT: "5"
      MODEL_SUBMISSION_DEADLINE_MS: "20000"
      PCCS_FMSPC: "20A06F000000"
      PCCS_FETCH: "1"
      PCCS_TEE: tdx
      P256_MODE: fallback
      DEPLOY_TDX_V4_DCAP: "1"
      VERIFY_TDX_QUOTE_ONCHAIN: "1"
      AGGREGATOR_TIMEOUT_REPORT_PERCENT: "50"
      EXPECTED_WORKER_IMAGE: "ghcr.io/uzhw8rgl/master-thesis-dfl-worker@sha256:578e7fe9c5426c2ed92119a26bee4be54b664e93e6aa71bd91bf9af4fdb1b7b4"
      PCCS_QUOTE_PATH: /dfl/data/phala_tdx_quote
      TDX_REFERENCE_QUOTE_PATH: /dfl/data/dstack-dev-0.5.9-de9c74f0-reference-tdx-quote
      DATASET_NAME: mnist
      W0_ACCOUNT_ADDRESS: "REPLACE_WITH_WORKER_ADDRESS"
      W1_ACCOUNT_ADDRESS: "REPLACE_WITH_WORKER_ADDRESS"
      WORKER_ACCOUNT_ADDRESSES: "REPLACE_WITH_WORKER0_ADDRESS,REPLACE_WITH_WORKER1_ADDRESS,REPLACE_WITH_WORKER2_ADDRESS"
      WORKER_ACCOUNT_BALANCE_WEI: "10000000000000000000000"
    command: ["bash", "/dfl/smart_contracts/starter_docker.sh"]
