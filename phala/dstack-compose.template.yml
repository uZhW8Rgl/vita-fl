services:
  dfl-worker:
    # Replace the digest after running the "Publish DFL Worker Image" workflow.
    # The digest-pinned image reference is what becomes part of the measured
    # Phala/dstack application configuration.
    image: ghcr.io/uzhw8rgl/master-thesis-dfl-worker@sha256:368f0718e1c4b88711a50ac31d80343d5baeee9de47b81c37e3328b20c8b59ef
    restart: unless-stopped
    volumes:
      - /var/run/tappd.sock:/var/run/tappd.sock
    environment:
      DOCKER: phala
      NODE_ENV: production
      IPFS_PROVIDER: kubo
      KUBO_API: "REPLACE_WITH_KUBO_API_URL"
      KUBO_GATEWAY: "REPLACE_WITH_KUBO_GATEWAY_URL"
      PUBLIC_IP: ""
      MSG_BROKER_IP: ""

      # Runtime configuration for the DFL prototype.
      ACCOUNT_ADDRESS: "REPLACE_WITH_WORKER_ADDRESS"
      PRIVATE_KEY: "REPLACE_WITH_WORKER_PRIVATE_KEY"
      # Auto-resolved from the contract-runtime TEE's Kubo manifest at
      # /runtime/contracts.json when the worker boots.
      REGISTRY_ADDRESS: ""
      AGGREGATOR_ADDRESS: ""
      GM_STORAGE_ADDRESS: ""
      SEPOLIA_RPC_URL: "REPLACE_WITH_RPC_URL"

      CLIENT_LIMIT: "2"
      EPOCH: "1"
      ROUND: "1"
      MODEL_SUBMISSION_DEADLINE_MS: "20000"
      GM_UPDATE_TIMEOUT_MS: "30000"
      GM_UPDATE_TIMEOUT_LOOPS: "2"
      AGGREGATION_UPDATE_ESTIMATE_MS: "30000"
      GM_UPDATE_POLL_MS: "5000"

      # The image contains demo keys, but production deployments should inject
      # worker-specific RSA keys through secrets or environment configuration.
      RSA_PRIVATE_KEY_FILE: /dfl/keys/private_key.pem
      RSA_PUBLIC_KEY_FILE: /dfl/keys/public_key.pem
      TRAIN_IMAGES_SRC: /dfl/config/training_data/train-images-0.idx3-ubyte
      TRAIN_LABELS_SRC: /dfl/config/training_data/train-labels-0.idx1-ubyte

      PYTHON_SERVICE_URL: http://127.0.0.1:8000
    command:
      - /bin/bash
      - -lc
      - |
        if [ -S /var/run/tappd.sock ] && [ ! -S /var/run/dstack.sock ]; then
          ln -sf /var/run/tappd.sock /var/run/dstack.sock
        fi
        exec /dfl/start_node_neural_network.sh
