services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:nightly-dd0a687aa36ec731b6ea2cda2aa4f32e192814fa
    restart: unless-stopped
    environment:
      ANVIL_IP_ADDR: "0.0.0.0"
      FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
    entrypoint:
      - anvil
    command:
      - --quiet
      - --accounts
      - "20"
      - --hardfork
      - osaka
      - --code-size-limit
      - "999999"
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 5s
      timeout: 3s
      retries: 24

  ipfs:
    image: ipfs/kubo:latest
    restart: unless-stopped
    environment:
      IPFS_TELEMETRY: "off"
    ports:
      - "5001:5001"
      - "8080:8080"
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 5s
      timeout: 5s
      retries: 24

  smart-contracts:
    image: ghcr.io/uzhw8rgl/master-thesis-smart-contracts@sha256:f587d0f41089d5cf6520b1ab9c85627a3e75cbfdc8bdb2b32d97dbd4d1bf1cec
    restart: "no"
    depends_on:
      anvil:
        condition: service_healthy
      ipfs:
        condition: service_healthy
    environment:
      DOCKER: phala
      RPC_URL: http://anvil:8545
      KUBO_API_URL: http://ipfs:5001
      IPFS_PROVIDER: kubo
      KEEP_ALIVE: "0"
      PCCS_FMSPC: "20A06F000000"
      PCCS_FETCH: "1"
      PCCS_TEE: tdx
      P256_MODE: fallback
      DEPLOY_TDX_V4_DCAP: "1"
      VERIFY_TDX_QUOTE_ONCHAIN: "1"
      AGGREGATOR_TIMEOUT_REPORT_PERCENT: "50"
      EXPECTED_WORKER_IMAGE: "ghcr.io/uzhw8rgl/master-thesis-dfl-worker@sha256:f97da8da8fc0286b4175d16c895c91cc789ef225a61ade5a706b82ba688e6b22"
      PCCS_QUOTE_PATH: /dfl/data/phala_tdx_quote
      TDX_REFERENCE_QUOTE_PATH: ""
      PHALA_COMPOSE_PATH: /dfl/phala/dstack-compose.template.yml
      PHALA_APP_CODE_PATH: /dfl/phala/app_code.txt
      PHALA_RTMR3_EVENT_LOG_PATH: /dfl/phala/rtmr3_event_log.txt
      PHALA_RTMR3_EVENT_DIGESTS: ""
      PHALA_ENFORCE_COMPOSE_HASH: "0"
      DATASET_NAME: chestmnist
      W0_ACCOUNT_ADDRESS: "0x561c6C160021EBfD0810F013f4efCa24edB7e9E3"
      W1_ACCOUNT_ADDRESS: "0x6004D395731f85938177d5B07aCfEc2D5D7ECcB0"
      WORKER_ACCOUNT_ADDRESSES: "0x561c6C160021EBfD0810F013f4efCa24edB7e9E3,0x6004D395731f85938177d5B07aCfEc2D5D7ECcB0,0xe10eD43A9095c7fe7EFcf9C4C75f625FDA40E692"
      WORKER_ACCOUNT_BALANCE_WEI: "10000000000000000000000"
      INITIAL_GM_SIGNER_ADDRESS: "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
    command: ["bash", "/dfl/smart_contracts/starter_docker.sh"]
