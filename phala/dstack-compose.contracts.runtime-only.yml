services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:nightly-dd0a687aa36ec731b6ea2cda2aa4f32e192814fa
    restart: unless-stopped
    environment:
      ANVIL_IP_ADDR: "0.0.0.0"
      FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
    entrypoint:
      - anvil
    command:
      - --quiet
      - --accounts
      - "500"
      - --hardfork
      - osaka
      - --code-size-limit
      - "999999"
      - --gas-limit
      - "1000000000"
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 5s
      timeout: 3s
      retries: 24

  rpc-proxy:
    image: ghcr.io/uzhw8rgl/master-thesis-smart-contracts@sha256:b08ca9e141c7259774b8ec6988e7f7e8fbf5c94c597964a35726bf85672af5a6
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      anvil:
        condition: service_healthy
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      RPC_PROXY_UPSTREAM: http://anvil:8545
    command: ["python3", "/dfl/smart_contracts/rpc_proxy.py"]
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8545/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 24

  ipfs:
    image: ipfs/kubo:latest
    restart: unless-stopped
    environment:
      IPFS_TELEMETRY: "off"
    ports:
      - "5001:5001"
      - "8080:8080"
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 5s
      timeout: 5s
      retries: 24

  smart-contracts:
    image: ghcr.io/uzhw8rgl/master-thesis-smart-contracts@sha256:b08ca9e141c7259774b8ec6988e7f7e8fbf5c94c597964a35726bf85672af5a6
    restart: "no"
    depends_on:
      anvil:
        condition: service_healthy
      ipfs:
        condition: service_healthy
    environment:
      DOCKER: phala
      RPC_URL: http://anvil:8545
      KUBO_API_URL: http://ipfs:5001
      IPFS_PROVIDER: kubo
      # Supply these through Phala's encrypted environment.
      ETH_WALLET_PRIVATE_KEY: "${ETH_WALLET_PRIVATE_KEY}"
      CLIENT_LIMIT: "2"
      MODEL_SUBMISSION_DEADLINE_MS: "20000"
      PCCS_FMSPC: "20A06F000000"
      PCCS_FETCH: "1"
      PCCS_TEE: tdx
      P256_MODE: fallback
      DEPLOY_TDX_V4_DCAP: "1"
      VERIFY_TDX_QUOTE_ONCHAIN: "1"
      AGGREGATOR_TIMEOUT_REPORT_PERCENT: "50"
      EXPECTED_WORKER_IMAGE: "ghcr.io/uzhw8rgl/master-thesis-dfl-worker@sha256:c25feb4b38df34efe895652ba686b607751560f1941174131e9a2f77439c9937"
      PCCS_QUOTE_PATH: /dfl/data/phala_tdx_quote
      TDX_REFERENCE_QUOTE_PATH: ""
      DATASET_NAME: chestmnist
      W0_ACCOUNT_ADDRESS: "0x561c6C160021EBfD0810F013f4efCa24edB7e9E3"
      W1_ACCOUNT_ADDRESS: "0x6004D395731f85938177d5B07aCfEc2D5D7ECcB0"
      WORKER_ACCOUNT_ADDRESSES: "0x561c6C160021EBfD0810F013f4efCa24edB7e9E3,0x6004D395731f85938177d5B07aCfEc2D5D7ECcB0,0xe10eD43A9095c7fe7EFcf9C4C75f625FDA40E692"
      WORKER_ACCOUNT_BALANCE_WEI: "10000000000000000000000"
    command: ["bash", "/dfl/smart_contracts/starter_docker.sh"]
