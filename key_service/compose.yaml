name: vita-fl-attested-keys
services:
  anvil:
    image: ghcr.io/uzhw8rgl/master-thesis-smart-contracts@sha256:19180092da9e8a7b4783fba589788d1269f2e216e01efb39e8021819901a32ad
    entrypoint: /root/.foundry/bin/anvil
    command: ["--host", "0.0.0.0", "--chain-id", "31337", "--state", "/state/anvil.json", "--state-interval", "5", "--silent"]
    ports: ["127.0.0.1:19545:8545"]
    volumes: ["anvil-state:/state"]
    stop_grace_period: 15s
  key-service:
    build:
      context: ..
      dockerfile: key_service/Dockerfile
    user: "${KEY_SERVICE_UID:-10001}:${KEY_SERVICE_GID:-10001}"
    environment:
      KEY_SERVICE_RPC_URL: http://anvil:8545
      KEY_SERVICE_POLICY: ${KEY_SERVICE_POLICY:-}
      KEY_SERVICE_POLICY_CODE_HASH: ${KEY_SERVICE_POLICY_CODE_HASH:-}
      KEY_SERVICE_REGISTRY: ${KEY_SERVICE_REGISTRY:-}
      KEY_SERVICE_ID: ${KEY_SERVICE_ID:-}
      KEY_SERVICE_ROOT_FILE: /state/root.key
      RATLS_ALLOWED_PLATFORM_MEASUREMENTS: ${RATLS_ALLOWED_PLATFORM_MEASUREMENTS:-}
    volumes: ["./private:/state"]
    ports: ["127.0.0.1:19002:8000"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [anvil]
volumes:
  anvil-state:
